appId: com.seanlaplante.kidqr
productName: Kid QR
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - build/icon.png
  - package.json
  # The renderer is fully bundled by Vite, so no runtime node_modules are needed.
  - '!**/node_modules/**'
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.education
  extendInfo:
    NSCameraUsageDescription: Kid QR uses the camera to scan QR codes.
linux:
  target:
    - AppImage
    - deb
  category: Education
  maintainer: Sean LaPlante
publish:
  provider: github
  releaseType: release
